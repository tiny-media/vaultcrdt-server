[workspace]
resolver = "2"
members = ["."]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tiny-media/vaultcrdt-server"

[package]
name = "vaultcrdt-server"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "vaultcrdt_server"
path = "src/lib.rs"

[[bin]]
name = "vaultcrdt-server"
path = "src/main.rs"

[dependencies]
axum            = { version = "0.8", features = ["ws"] }
rusqlite        = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
jsonwebtoken    = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
loro            = "=1.16.0"
rmp-serde       = "1"
serde           = { version = "1", features = ["derive"] }
serde_bytes     = "0.11"
serde_json      = "1"
futures-util    = "0.3"
tokio           = { version = "1", features = ["full"] }
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror       = "2"
anyhow          = "1"
uuid            = { version = "1", features = ["v4"] }
argon2          = "0.6.0"
sha2            = "0.10"
password-hash   = { version = "0.6.1", features = ["phc"] }

[dev-dependencies]
tower             = "0.5"
tokio-tungstenite = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
