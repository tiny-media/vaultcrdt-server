name: Security

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    name: CodeQL (rust, buildless)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  build-locked:
    name: cargo build --locked (compile check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
      - name: Build with locked dependencies
        run: cargo build --locked

  osv-scanner:
    name: osv-scanner (Cargo.lock)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Scan Cargo.lock against the OSV database
        # Advisory mode until triage: 7 RustSec advisories, all transitive
        # (im/bitmaps/sized-chunks via loro, atomic-polyfill, rsa 5.9 M);
        # none have fixed versions. SARIF still lands in the Security tab.
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.5.1 \
            --format sarif --output osv-results.sarif ./
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv-results.sarif

  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock against RustSec
        # Advisory mode until triage: same 7 transitive advisories as the
        # osv-scanner job; no fixed versions exist yet.
        continue-on-error: true
        run: cargo audit --file Cargo.lock
